name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.txt ./...
      - name: Build
        run: go build -ldflags "-X main.version=ci" ./...

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build binary
        run: go build -o k8s-job-ttl-audit ./cmd/k8s-job-ttl-audit
      - name: Offline scan finds stale Jobs (expect exit 1 on --fail-on)
        run: |
          set +e
          ./k8s-job-ttl-audit scan --input examples/jobs-dump.json --max-ttl 24h --fail-on stale
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from --fail-on stale, got $code" >&2
            exit 1
          fi
          echo "smoke ok: fail-on stale gated correctly"
      - name: JSON output is valid
        run: ./k8s-job-ttl-audit scan --input examples/jobs-dump.json -o json | python3 -c "import sys,json; json.load(sys.stdin)"
